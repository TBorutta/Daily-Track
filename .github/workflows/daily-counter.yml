name: Daily Counter

on:
  schedule:
    # Jeden Tag um 00:00 UTC
    - cron: "0 0 * * *"

  # Ermöglicht einen manuellen Start
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-counter:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Counter erhöhen
        run: python counter.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add counter.txt

          git commit -m "Daily counter update - $(date '+%d.%m.%Y')"

          git push